<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCANA Incremental Rise</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main id="game">
        <pre id="title">ARCANA Incremental Rise

계속하는 한 끝나지 않는 세계</pre>

        <section id="authPanel" aria-labelledby="authTitle">
            <h1 id="authTitle">기록의 서고에 접속</h1>
            <p id="authDescription">이메일과 비밀번호로 모험가 기록에 로그인하세요.</p>
            <form id="authForm">
                <label for="authEmail">이메일</label>
                <input
                    id="authEmail"
                    name="email"
                    type="email"
                    autocomplete="email"
                    autofocus
                    required>

                <div id="characterNameField" hidden>
                    <label for="characterName">모험가 이름</label>
                    <input
                        id="characterName"
                        name="characterName"
                        type="text"
                        maxlength="24"
                        autocomplete="nickname">
                </div>

                <label for="authPassword">비밀번호</label>
                <input
                    id="authPassword"
                    name="password"
                    type="password"
                    minlength="6"
                    autocomplete="current-password"
                    required>

                <button id="authSubmit" type="submit">로그인</button>
            </form>
            <p id="authMessage" role="status" aria-live="polite"></p>
            <button id="resendConfirmationButton" class="text-button" type="button" hidden>
                확인 메일 다시 보내기
            </button>
            <button id="authModeToggle" class="text-button" type="button">새 계정 만들기</button>
        </section>

        <section id="gamePanel" hidden aria-label="게임 터미널">
            <div id="accountBar">
                <span id="accountLabel"></span>
                <button id="signOutButton" type="button">로그아웃</button>
            </div>

            <section id="terminal" aria-label="게임 터미널">
                <div id="output" role="log" aria-live="polite" aria-relevant="additions"></div>

                <form id="commandForm" autocomplete="off">
                    <label id="prompt" for="commandInput">이름:</label>
                    <input
                        id="commandInput"
                        name="command"
                        type="text"
                        placeholder="이름을 입력하고 Enter를 누르세요"
                        aria-label="명령어 입력">
                </form>
            </section>
            <p class="terminal-note">명령어를 입력한 뒤 Enter를 누르세요.</p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
</body>

</html>
